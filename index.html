<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой день">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Мой день</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--acc:#7c5cff;--acc-s:rgba(124,92,255,.16);--acc-m:rgba(124,92,255,.32);--danger:#ef4444;--ok:#22c55e;--warn:#f97316;--r:16px}
body.dark{--bg:#0f1115;--card:#181b22;--card2:#21252e;--text:#eef0f4;--muted:#8a90a0;--line:#2a2f3a;--shadow:0 8px 30px rgba(0,0,0,.45);--scrim:rgba(0,0,0,.55)}
body.light{--bg:#f3f4f8;--card:#ffffff;--card2:#eceef3;--text:#15171c;--muted:#6b7280;--line:#e1e4ea;--shadow:0 8px 30px rgba(20,20,50,.12);--scrim:rgba(20,20,40,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;font-size:15px;line-height:1.35;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.f{fill:currentColor;stroke:none}
.i.s{width:15px;height:15px}
#view{position:fixed;left:0;right:0;top:var(--sat);bottom:calc(64px + var(--sab));overflow-y:auto;padding:0 16px 96px;-webkit-overflow-scrolling:touch}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sab));padding-bottom:var(--sab);background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:500;transition:color .2s}
#nav button .pill{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
#nav button.on{color:var(--text)}
#nav button.on .pill{background:var(--acc-s);color:var(--acc)}
#fab{position:fixed;right:18px;bottom:calc(80px + var(--sab));width:58px;height:58px;border-radius:20px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px var(--acc-m);z-index:21;transition:transform .15s}
#fab:active{transform:scale(.92)}
#fab .i{width:26px;height:26px;stroke-width:2.4}
#fab.hide{display:none}

.hero{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 0 14px;gap:10px}
.h1{font-size:26px;font-weight:750;letter-spacing:-.4px}
.h2{font-size:20px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hbtns{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);background:var(--card);flex:none}
.ib.on{color:var(--acc);background:var(--acc-s)}
.ib.plain{background:none}
.ib:active,.btn:active,.chip:active{opacity:.7}

.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.prog{display:flex;align-items:center;gap:16px}
.ringw{position:relative;flex:none}
.ringw .rl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.prog .pt{font-weight:650;font-size:16px}
.prog .ps{display:flex;gap:14px;margin-top:8px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.prog .ps span{display:flex;align-items:center;gap:5px}

.qa{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:4px 4px 4px 14px;margin-bottom:6px;border:1.5px solid transparent;transition:border-color .2s}
.qa:focus-within{border-color:var(--acc)}
.qa input{flex:1;background:none;border:0;outline:0;padding:10px 0;min-width:0}
.qa input::placeholder{color:var(--muted)}
.qa button{width:38px;height:38px;border-radius:11px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.qa-prev{display:flex;flex-wrap:wrap;gap:6px;min-height:0;margin:0 0 8px}
.qa-prev:empty{margin:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:8px;background:var(--acc-s);color:var(--acc);font-weight:600}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;color:var(--muted);font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.6px}
.sec button{color:var(--acc);font-size:12.5px;font-weight:650;text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:4px}
.sec.red{color:var(--danger)}
.cnt{background:var(--card2);color:var(--muted);border-radius:8px;padding:1px 7px;margin-left:6px;font-size:11.5px}

.task{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;transition:opacity .25s,transform .25s}
.task .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--pc,var(--muted));flex:none;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px;transition:all .2s}
.task .chk .i{width:14px;height:14px;stroke-width:3}
.task.done .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task.pop .chk{animation:pop .3s}
.task.fade{opacity:.35;transform:scale(.98)}
@keyframes pop{50%{transform:scale(1.3)}}
.tb{flex:1;min-width:0}
.tt{font-size:15px;word-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;color:var(--muted);font-size:12px}
.meta .m{display:flex;align-items:center;gap:4px}
.meta .m .i{width:13px;height:13px}
.meta .late{color:var(--danger)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--acc-s);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .big .i{width:30px;height:30px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

.tl-row{display:flex;gap:10px;min-height:46px;border-top:1px dashed var(--line)}
.tl-h{width:44px;flex:none;color:var(--muted);font-size:12px;padding-top:6px}
.tl-c{flex:1;padding:6px 0 0}
.tl-c .task{margin-bottom:6px}
.tl-row.now .tl-h{color:var(--acc);font-weight:700}
.tl-row.now{border-top:2px solid var(--acc)}
.tl-add{width:100%;height:34px;border-radius:10px}
.tl-add:active{background:var(--card)}

.cal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 0 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--r);padding:10px}
.cal .wd{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;position:relative}
.cal .d.o{color:var(--muted);opacity:.45}
.cal .d.t{color:var(--acc);font-weight:800}
.cal .d.s{background:var(--acc);color:#fff}
.cal .d .ds{display:flex;gap:2px;height:5px}
.cal .d .ds i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cal .d.s .ds i{background:#fff!important}
.cal .d.full::after{content:"";position:absolute;inset:3px;border-radius:9px;border:1.5px solid var(--ok);opacity:.7}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:11px;background:var(--card2);font-size:13.5px;white-space:nowrap;font-weight:500;flex:none}
.chip.on{background:var(--acc);color:#fff}
.chip .i{width:15px;height:15px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:13px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:none;padding:12px 0;color:var(--text)}
.ngrid{columns:2;column-gap:10px;margin-top:12px}
.ncard{break-inside:avoid;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1.5px solid transparent;display:block;position:relative}
.ncard .nt{font-weight:650;margin-bottom:5px;word-wrap:break-word;padding-right:16px}
.ncard .nb{color:var(--muted);font-size:13.5px;white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.ncard .nl{font-size:13.5px;color:var(--muted)}
.ncard .nl div{display:flex;gap:6px;align-items:center;margin:2px 0}
.ncard .nl .d{text-decoration:line-through;opacity:.7}
.ncard .nl .i{width:13px;height:13px}
.ncard .nf{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.ncard .nf span{display:flex;align-items:center;gap:3px;background:var(--card2);padding:2px 7px;border-radius:7px}
.ncard .pin{position:absolute;top:10px;right:9px;color:var(--acc)}
.ncard .pin .i{width:14px;height:14px}

.hcard{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hrow{display:flex;align-items:center;gap:12px}
.hn{flex:1;min-width:0}
.hn b{font-size:16px;font-weight:650;display:block}
.hbig{width:46px;height:46px;border-radius:15px;border:2px solid var(--hc);color:var(--hc);display:flex;align-items:center;justify-content:center;flex:none;transition:all .2s}
.hbig.on{background:var(--hc);color:#fff}
.hbig .i{width:22px;height:22px;stroke-width:2.6}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.hweek button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.hweek .c{width:30px;height:30px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:transparent}
.hweek .c .i{width:14px;height:14px;stroke-width:3}
.hweek .on .c{background:var(--hc);color:#fff}
.hweek .na .c{opacity:.35}
.hweek .td{color:var(--text);font-weight:700}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--warn);font-weight:650}
.streak .i{width:14px;height:14px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--card2)}
.heat i.on{background:var(--hc)}
.heat i.na{opacity:.3}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.mi{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:110px}
.mi .ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--acc-s);color:var(--acc)}
.mi b{font-size:15px}
.mi span{color:var(--muted);font-size:12.5px;margin-top:-6px}
.sub-head{display:flex;align-items:center;gap:10px;padding:16px 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rl{flex:1;min-width:0}
.row .rl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:550}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15)}
body.dark .seg button.on{background:#323846}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(18px)}
.sel{background:var(--card2);border:0;border-radius:10px;padding:8px 10px;outline:0;max-width:170px}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff}
.colors button.on{border-color:var(--text)}
.colors button .i{width:16px;height:16px;stroke-width:3}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
.st.ok{color:var(--ok)}.st.bad{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:13px;background:var(--acc);color:#fff;font-weight:650;font-size:14.5px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);padding:14px}
.stat b{font-size:24px;font-weight:750;display:block}
.stat span{color:var(--muted);font-size:12.5px}
.chart text{fill:var(--muted);font-size:10px}
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.bar-row .bn{width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;border-radius:4px}
.bar-row .bv{width:28px;text-align:right;color:var(--muted)}

.fz{display:flex;flex-direction:column;align-items:center}
.fz-ring{position:relative;margin:22px 0 18px}
.fz-ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fz-ring .tm{font-size:46px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums}
.fz-ring .md{color:var(--muted);font-size:13px;margin-top:2px}
.fz-btns{display:flex;align-items:center;gap:22px;margin-bottom:20px}
.fz-main{width:76px;height:76px;border-radius:26px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px var(--acc-m)}
.fz-main .i{width:32px;height:32px}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:32px;text-align:center;font-size:16px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:18px;font-weight:600}

/* sheets */
.layer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.85,.25,1);padding:6px 16px calc(26px + var(--sab));box-shadow:var(--shadow)}
.sheet.full{top:0;max-height:none;border-radius:0;background:var(--bg);padding-top:calc(6px + var(--sat))}
#sat{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:40}
body.light #sat{background:var(--acc)}
body.web .and-only{display:none!important}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--acc-s);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.install .i{color:var(--acc);margin-top:1px}
.install b{display:block;margin-bottom:2px}
.install .x{margin-left:auto;color:var(--muted);padding:2px}
.layer.open .scrim{opacity:1}
.layer.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet.full .grab{display:none}
.lbl{color:var(--muted);font-size:12.5px;font-weight:650;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.lbl .i{width:14px;height:14px}
.inp{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;outline:0}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:none;min-height:70px}
.e-title{width:100%;background:none;border:0;outline:0;font-size:20px;font-weight:650;padding:6px 0}
.e-title::placeholder,.inp::placeholder{color:var(--muted);font-weight:400}
.e-top{display:flex;align-items:center;gap:8px}
.e-row{display:flex;gap:8px;align-items:center}
.e-row .inp{flex:1}
.sub-i{display:flex;align-items:center;gap:10px;padding:4px 0}
.sub-i .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.sub-i .chk .i{width:13px;height:13px;stroke-width:3}
.sub-i.d .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.sub-i.d input{text-decoration:line-through;color:var(--muted)}
.sub-i input{flex:1;background:none;border:0;outline:0;padding:7px 0;min-width:0}
.sub-i .x{color:var(--muted);padding:4px}
.e-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.e-acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;background:var(--card2);font-size:11.5px;color:var(--muted)}
.e-acts button.del{color:var(--danger)}
.hint{font-size:12.5px;color:var(--warn);margin-top:6px;display:flex;gap:6px;align-items:center}
.hint .i{width:14px;height:14px}

.ned{display:flex;flex-direction:column;min-height:100%}
.ned-top{display:flex;align-items:center;gap:4px;padding:8px 0}
.sp{flex:1}
.ned-title{background:none;border:0;outline:0;font-size:22px;font-weight:700;padding:10px 0 6px;width:100%}
.ned-body{background:none;border:0;outline:0;width:100%;min-height:45vh;resize:none;font-size:16px;line-height:1.5;padding:4px 0}
.ned-tags{background:none;border:0;border-top:1px solid var(--line);outline:0;padding:12px 0;width:100%;color:var(--muted);font-size:14px;margin-top:10px}
.ned-foot{color:var(--muted);font-size:12px;padding:8px 0 20px}
.ned-rem{display:flex;align-items:center;gap:8px;background:var(--acc-s);color:var(--acc);border-radius:12px;padding:6px 6px 6px 12px;margin:6px 0}
.ned-rem input{flex:1;background:none;border:0;outline:0;color:var(--acc);font-weight:600;min-width:0}
.cf-t{font-size:16px;font-weight:600;padding:10px 0 4px;text-align:center}
.cf-s{color:var(--muted);text-align:center;font-size:14px}
.list-act button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15px;border-bottom:1px solid var(--line)}
.list-act button:last-child{border:0}
.list-act .red{color:var(--danger)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(78px + var(--sab));background:#262a33;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast button{color:#b9a8ff;font-weight:700}
.mt{margin-top:12px}
.muted{color:var(--muted)}
.help li{margin:6px 0 6px 18px;line-height:1.45}
</style>
</head>
<body class="dark">

    }
    case 'habitEdit': editHabit(d.id); break;
    case 'more': if (d.m === 'backup') { backupSheet(); break; } S.tab = 'more'; S.more = d.m; render(); $('#view').scrollTop = 0; break;
    case 'back': S.more = ''; render(); break;
    case 'fStart': focusStart(); break;
    case 'fPause': focusPause(); break;
    case 'fReset': focusReset(); break;
    case 'fSkip': D.focus.mode = D.focus.mode === 'work' ? 'break' : 'work'; focusReset(); break;
    case 'fMode': if (D.focus.mode !== d.m) { D.focus.mode = d.m; focusReset(); } break;
    case 'fStep': { if (D.focus.running) { toast('Сначала поставьте таймер на паузу'); break; } const k = d.k, mn = k === 'focusWork' ? 5 : 1; D.settings[k] = Math.max(mn, Math.min(180, D.settings[k] + +d.d)); focusReset(); break; }
    case 'fDone': { const t = byId(D.focus.taskId); if (t) { setDone(t, isRep(t) ? today() : (t.date || today()), true); D.focus.taskId = ''; save(); render(); toast('Задача выполнена'); } break; }
    case 'set': setSetting(d.k, d.v); break;
    case 'perm': try { A && A.openSettings(d.p); } catch (err) {} break;
    case 'testN': if (A) { if (devInfo && !devInfo.notif) A.requestNotif(); A.testNotify(); toast('Уведомление придёт через 5 секунд'); } else toast('Работает только в приложении'); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'clearDone': {
      const n = D.tasks.filter(t => !isRep(t) && t.done).length;
      if (!n) { toast('Выполненных задач нет'); break; }
      confirmBox(`Удалить ${n} ${plural(n,'задачу','задачи','задач')}?`, 'Повторяющиеся задачи не затрагиваются', 'Удалить', () => { D.tasks = D.tasks.filter(t => isRep(t) || !t.done); save(); render(); });
      break;
    }
    case 'catAdd': promptText('Новая категория', '', 'Название', name => { D.cats.push({id:uid(), name, color:ACCENTS[D.cats.length % ACCENTS.length]}); save(); render(); }); break;
    case 'catColor': { const c = catOf(d.id); if (c) { c.color = ACCENTS[(ACCENTS.indexOf(c.color) + 1) % ACCENTS.length]; save(); render(); } break; }
    case 'catDel': { const c = catOf(d.id); if (!c) break; confirmBox(`Удалить «${c.name}»?`, 'Задачи останутся, но без категории', 'Удалить', () => { D.cats = D.cats.filter(x => x.id !== c.id); D.tasks.forEach(t => { if (t.cat === c.id) t.cat = ''; }); save(); render(); }); break; }
  }
});
function backupSheet() {
  const sh = openSheet(`<div class="cf-t">Резервная копия</div><div class="cf-s">Сохраните файл, чтобы перенести данные на другой телефон или не потерять их</div><div class="btns"><button class="btn ghost" data-a="import">${ic('upload','s')}Загрузить</button><button class="btn" data-a="export">${ic('download','s')}Сохранить</button></div>`);
  sh.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (!a) return; closeSheet(); if (a.dataset.a === 'export') exportData(); else importData(); });
}
$('#fab').addEventListener('click', fabClick);
document.addEventListener('submit', e => {
  const f = e.target.closest('.qa'); if (!f) return;
  e.preventDefault();
  const inp = $('input', f), t = quickAdd(inp.value, f.dataset.k);
  if (!t) return;
  inp.value = '';
  render();
  const n = $('#qa'); if (n) n.focus();
  toast(t.date && t.date !== f.dataset.k ? 'Добавлено на ' + human(t.date).toLowerCase() : 'Задача добавлена');
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('.layer')) return;
  if (el.id === 'qa') { const p = $('#qa-prev'); if (p) p.innerHTML = qaPreview(el.value, el.closest('.qa').dataset.k); }
  else if (el.id === 'nq') { S.nq = el.value; $('#ngrid').innerHTML = noteGrid(); }
  else if (el.dataset.cat) { const c = catOf(el.dataset.cat); if (c) { c.name = el.value.trim() || c.name; save(); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('.layer')) return;
  if (el.dataset.set) setSetting(el.dataset.set, el.value);
  else if (el.id === 'fTask') { D.focus.taskId = el.value; save(); render(); }
});

/* ---------- связь с Android ---------- */
window.goBack = () => {
  if (sheets.length) { closeSheet(); return true; }
  if (S.tab === 'more' && S.more) { S.more = ''; render(); return true; }
  if (S.tab !== 'today') { go('today'); return true; }
  return false;
};
window.reloadData = () => {
  clearTimeout(saveT); saveT = 0;
  D = load();
  const f = D.focus; if (f.running && Date.now() >= f.endAt) focusComplete();
  if (!sheets.length) render(); else { applyTheme(); }
};
window.appOpen = arg => {
  arg = String(arg || '');
  const [k, ...rest] = arg.split(':'), v = rest.join(':');
  closeAll();
  if (k === 'quickadd') { go('today'); editTask(null, {date:today()}); }
  else if (k === 'newnote') { go('notes'); openNote(null); }
  else if (k === 'tab') go(v || 'today');
  else if (k === 'task') { go('today'); if (byId(v)) editTask(v); }
  else if (k === 'note') { go('notes'); openNote(v); }
  else if (k === 'habit') go('habits');
  else if (k === 'timer') { S.tab = 'more'; S.more = 'focus'; render(); }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
if (!A && 'serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }

/* старт */
(function start() {
  const f = D.focus; if (f.running && Date.now() >= f.endAt) focusComplete();
  render();
  if (A && !D.settings.askedNotif) { D.settings.askedNotif = true; save(); setTimeout(() => { try { A.requestNotif(); } catch (e) {} }, 800); }
})();
</script>
